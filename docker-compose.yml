services:
  backend:
    build:
      context: ./backend
    container_name: rag-backend
    ports:
      - "8080:8080"
    env_file:
      - .env
    volumes:
      - uploads:/app/uploads
      - chroma_db:/app/chroma_db

  frontend:
# ...
    build:
      context: ./frontend
    container_name: rag-frontend
    ports:
      - "5173:5173"
    depends_on:
      - backend

volumes:
  uploads:
  chroma_db: